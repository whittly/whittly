name: Deploy

on:
  push:
    branches: [main, develop]

jobs:
  ci:
    name: Lint & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - name: Build whittly.dev
        run: npm run build
        env:
          PUBLIC_API_URL: https://api.whittly.dev
      - name: Build whittly.ru
        run: npm run build:ru
        env:
          PUBLIC_API_URL: https://api.whittly.dev
          PUBLIC_SITE_DOMAIN: whittly.ru

  e2e:
    name: E2E Smoke Tests
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Build for preview
        run: npm run build
        env:
          PUBLIC_API_URL: https://api.whittly.dev
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            export PATH=$PATH:/usr/bin:/usr/local/bin
            cd /var/www/whittly/whittly
            git pull origin ${{ github.ref_name }}
            npm ci
            BUILD_DATE=$(date +%Y.%m.%d)
            VITE_BUILD_DATE=$BUILD_DATE PUBLIC_API_URL=https://api.whittly.dev npm run build
            echo "✓ frontend (${{ github.ref_name }}) deployed at $(date)"
